
services:
  # Keycloak Server (using existing PostgreSQL)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.6
    container_name: resolve360-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: CanvasHarsha123
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    volumes:
      - ./realm-config:/opt/keycloak/data/import
    networks:
      - resolve360-network
    command: start-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis
      - rabbitmq
      - minio

  # Redis for ticket queues and agent lookups
  redis:
    image: redis:7-alpine
    container_name: resolve360-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - resolve360-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ for background jobs and email processing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: resolve360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - resolve360-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO for file storage (ticket attachments)
  minio:
    image: soldevelo/minio:latest
    container_name: resolve360-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      MINIO_SERVER_URL: http://localhost:9000
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
      MINIO_BROWSER: "on"
      MINIO_SERVER_ACCESS_KEY: admin
      MINIO_SERVER_SECRET_KEY: admin123
      MINIO_BROWSER_SESSION_DURATION: "24h"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/bitnami/minio-storage
    networks:
      - resolve360-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  resolve360-network:
    driver: bridge
